name: Release ZIP

# Attaches an installable plugin ZIP to every Release.
#
# Two consumers need it, and both silently degraded without it (FIELD-REPORT-6):
#   - the bundled updater asks PUC for a release asset matching
#     /elementor-mcp.*\.zip/i and falls back to GitHub's source archive,
#   - Digitizer Pro Tools' onboarding installer prefers a .zip asset and falls
#     back to zipball_url,
# so client sites were installing the repository — tests, CI config and internal
# docs included — instead of a plugin build.
#
# WHY THE TAG PUSH IS THE TRIGGER
#
# A release that is visible without its asset is worse than a slow upload: a
# site checking in that window resolves the zipball fallback and PUC *persists*
# the package in its update state, so it can install the repository archive long
# after the upload lands. One badly-timed check outlives the fix.
#
# Draft releases cannot close that window either — GitHub does not run workflows
# for the `created` (or `edited`/`deleted`) activity types on a draft, so a
# draft-first flow would simply never build.
#
# Pushing the tag does fire, and nothing is visible yet at that point. So the
# job builds first and then makes a DRAFT release carrying the ZIP, which the
# release notes get written into and which becomes public — asset already
# attached — when a human publishes it. The updater is release-only by design,
# so the tag sitting there in the meantime offers nobody an update.
#
# `release: [published]` stays as a safety net for a release created public by
# hand: that window is not closed, but the asset arrives within a minute rather
# than never.
#
# THE TAG IS CUT HERE WHEN A VERSION BUMP LANDS ON MAIN
#
# A push to main that touches elementor-mcp.php reads the header version; when
# no tag `v<version>` exists yet, this job creates it on the pushed commit and
# builds exactly as for a pushed tag, ending at the same DRAFT. So merging a
# release PR is the whole release up to "publish". A push that changes the file
# without bumping the version finds its tag already there and does nothing, and
# a tag pushed by hand first wins the same way. A re-run after a failure past
# the tag resumes the build instead of skipping it: the tag on this commit
# counts as done only once its release carries the ZIP. The tag is created by this job,
# with GITHUB_TOKEN — which, by GitHub's design, does not start another run —
# so nothing builds twice.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [elementor-mcp.php]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the ZIP to"
        required: true

permissions:
  contents: write

# One run per commit at a time: the main-push run and a tag pushed by hand on
# the same commit would otherwise race to create the same release. Queued, not
# cancelled — the second run finds the ZIP and stops (main path) or re-uploads
# it with --clobber (tag path).
concurrency:
  group: release-zip-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach elementor-mcp.zip
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            # A push to main: the tag is the header version, cut here when new.
            version="$(gh api "repos/$GITHUB_REPOSITORY/contents/elementor-mcp.php?ref=$GITHUB_SHA" --jq .content \
              | base64 -d | grep -m1 '^ \* Version:' | tr -d ' ' | cut -d: -f2)"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "could not read a version from elementor-mcp.php at $GITHUB_SHA: '$version'" >&2
              exit 1
            fi
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              # An existing tag is "done" only when this run has nothing left
              # to do. On another commit: no bump in this push. On THIS commit
              # with the ZIP already on its release: a finished earlier run.
              # On this commit WITHOUT the ZIP: an earlier attempt cut the tag
              # and then failed — resume the build rather than report a
              # success that left a tag with no release (Codex r1 on #86).
              tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
              if [ "$tagged" != "$GITHUB_SHA" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "$tag already exists on $tagged — no version bump in this push; nothing to release." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'elementor-mcp.zip'; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "$tag and its release ZIP already exist — nothing to do." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "$tag exists on this commit but its release has no ZIP — resuming the build." >> "$GITHUB_STEP_SUMMARY"
            else
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
                -f tag="$tag" -f message="elementor-mcp $version" -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" >/dev/null
              echo "Cut $tag on $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            tag="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The plugin sources come from the tag. The builder does NOT: a tag cut
      # before this workflow existed has no bin/build-zip.sh, which is exactly
      # the case workflow_dispatch is meant to backfill.
      - name: Checkout the tag
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Check out the builder from the default branch
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .builder
          sparse-checkout: bin/build-zip.sh
          sparse-checkout-cone-mode: false

      # Run the current builder against the tag's tree. It resolves its own root
      # from its location, so it has to sit inside that tree — and it excludes
      # itself from the ZIP either way.
      - name: Build the ZIP
        if: steps.tag.outputs.skip != 'true'
        run: |
          mkdir -p bin
          cp .builder/bin/build-zip.sh bin/build-zip.sh
          chmod +x bin/build-zip.sh
          rm -rf .builder
          bin/build-zip.sh

      # The ZIP is built from the checked-out tag, so a mismatch means the tag
      # was cut without the version bump — the update would install a plugin
      # that reports an older version and offers itself the same update forever.
      - name: Check the built version matches the tag
        if: steps.tag.outputs.skip != 'true'
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          built="$(grep -m1 '^ \* Version:' elementor-mcp.php | tr -d ' ' | cut -d: -f2)"
          if [ "${tag#v}" != "$built" ]; then
            echo "tag ${tag} does not match the plugin header version ${built}" >&2
            exit 1
          fi

      # Upload into whatever release already exists for this tag; create a draft
      # carrying the ZIP when none does. Never publishes: a release becomes
      # visible when a human says so, by which point the asset is on it.
      - name: Attach the ZIP to the release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/elementor-mcp.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/elementor-mcp.zip \
              --draft --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
            echo "Created a DRAFT release for $TAG with the ZIP attached — edit the notes and publish it." >> "$GITHUB_STEP_SUMMARY"
          fi
